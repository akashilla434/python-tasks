<!DOCTYPE html>
<html>

<head>

    <title>Library Management System</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

    <div class="container">

        <h1>Library Management System</h1>

        <!-- Add Book Form -->

        <form action="/add-book" method="post">

            <input type="number"
                   name="id"
                   placeholder="Book ID"
                   required>

            <input type="text"
                   name="name"
                   placeholder="Book Name"
                   required>

            <input type="text"
                   name="author"
                   placeholder="Author Name"
                   required>

            <input type="number"
                   step="0.01"
                   name="price"
                   placeholder="Book Price"
                   required>

            <button type="submit">

                Add Book

            </button>

        </form>

        <!-- Book Table -->

        <table>

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Author</th>
                <th>Price</th>
                <th>Status</th>
                <th>Action</th>

            </tr>

            {% for book in books %}

            <tr>

                <td>{{ book.id }}</td>
                <td>{{ book.name }}</td>
                <td>{{ book.author }}</td>
                <td>{{ book.price }}</td>
                <td>{{ book.status }}</td>

                <td>

                    <a href="/delete/{{ book.id }}">

                        Delete

                    </a>

                </td>

            </tr>

            {% endfor %}

        </table>

    </div>

</body>

</html>
