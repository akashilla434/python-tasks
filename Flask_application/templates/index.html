<!DOCTYPE html>
<html>
<head>
    <title>Todo App</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Todo App</h1>

        <form action="/add" method="POST">
            <input type="text" name="task" placeholder="Enter Task">
            <button type="submit">Add</button>
        </form>

        <ul>
            {% for task in tasks %}
            <li>
                {{ task }}

                <a href="/delete/{{ loop.index0 }}">
                    Delete
                </a>
            </li>
            {% endfor %}
        </ul>
    </div>

</body>
</html>
