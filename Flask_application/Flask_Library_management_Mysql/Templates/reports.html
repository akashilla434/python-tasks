<!DOCTYPE html>
<html>
<head>
    <title>Reports</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3">

    <a class="navbar-brand">
        📊 Issue Reports
    </a>

    <a href="/dashboard" class="btn btn-light">
        Back
    </a>

</nav>

<div class="container mt-5">

    <h2 class="mb-4">Issued Books Report</h2>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

            <tr>
                <th>Book Name</th>
                <th>Student Name</th>
                <th>Issue Date</th>
                <th>Return Date</th>
                <th>Fine</th>
            </tr>

        </thead>

        <tbody>

            {% for r in reports %}

            <tr>

                <td>{{ r[0] }}</td>
                <td>{{ r[1] }}</td>
                <td>{{ r[2] }}</td>
                <td>{{ r[3] }}</td>
                <td>₹{{ r[4] }}</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
