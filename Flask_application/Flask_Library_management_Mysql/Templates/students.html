<!DOCTYPE html>
<html>
<head>
    <title>Students</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3">

    <a class="navbar-brand">
        👨‍🎓 Students
    </a>

    <a href="/dashboard" class="btn btn-light">
        Back
    </a>

</nav>

<div class="container mt-5">

    <!-- ADD STUDENT -->

    <div class="card p-4 shadow mb-5">

        <h3 class="mb-4">Add Student</h3>

        <form method="POST" action="/add_student">

            <div class="row g-3">

                <div class="col-md-2">
                    <input type="text"
                           name="name"
                           class="form-control"
                           placeholder="Name"
                           required>
                </div>

                <div class="col-md-2">
                    <input type="email"
                           name="email"
                           class="form-control"
                           placeholder="Email"
                           required>
                </div>

                <div class="col-md-2">
                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Password"
                           required>
                </div>

                <div class="col-md-3">
                    <input type="text"
                           name="department"
                           class="form-control"
                           placeholder="Department"
                           required>
                </div>

                <div class="col-md-2">
                    <input type="text"
                           name="year"
                           class="form-control"
                           placeholder="Year"
                           required>
                </div>

                <div class="col-md-1">
                    <button class="btn btn-success w-100">
                        Add
                    </button>
                </div>

            </div>

        </form>

    </div>

    <!-- STUDENTS TABLE -->

    <h3 class="mb-3">Students List</h3>

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Year</th>
            </tr>

        </thead>

        <tbody>

            {% for s in students %}

            <tr>

                <td>{{ s[0] }}</td>
                <td>{{ s[1] }}</td>
                <td>{{ s[2] }}</td>
                <td>{{ s[4] }}</td>
                <td>{{ s[5] }}</td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
