<!DOCTYPE html>
<html>
<head>
    <title>Books</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-dark bg-dark px-3">

    <a class="navbar-brand">
        📚 Library Management
    </a>

    <a href="/dashboard" class="btn btn-light">
        Back
    </a>

</nav>

<nav class="navbar navbar-dark bg-dark px-3">

    <a class="navbar-brand">📚 Library Books</a>

    <a href="/dashboard" class="btn btn-light">
        Dashboard
    </a>

</nav>

<div class="container mt-5">

    <!-- ADD BOOK FORM -->

    <div class="card p-4 shadow mb-5">

        <h3 class="mb-4">Add Book</h3>

        <form method="POST" action="/add_book">

            <div class="row">

                <div class="col-md-3">
                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        placeholder="Book Title"
                        required
                    >
                </div>

                <div class="col-md-3">
                    <input
                        type="text"
                        name="author"
                        class="form-control"
                        placeholder="Author"
                        required
                    >
                </div>

                <div class="col-md-2">
                    <input
                        type="number"
                        name="price"
                        class="form-control"
                        placeholder="Price"
                        required
                    >
                </div>

                <div class="col-md-2">
                    <input
                        type="number"
                        name="quantity"
                        class="form-control"
                        placeholder="Quantity"
                        required
                    >
                </div>

                <div class="col-md-2">
                    <button class="btn btn-success w-100">
                        Add Book
                    </button>
                </div>

            </div>

        </form>

    </div>


    <!-- BOOK TABLE -->

    <h3 class="mb-3">Books List</h3>

    <table class="table table-bordered table-hover shadow">

        <thead class="table-dark">

            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Available</th>
                <th>Actions</th>
            </tr>

        </thead>

        <tbody>

            {% for b in books %}

            <tr>

                <td>{{ b[0] }}</td>
                <td>{{ b[1] }}</td>
                <td>{{ b[2] }}</td>
                <td>₹{{ b[3] }}</td>
                <td>{{ b[4] }}</td>
                <td>{{ b[5] }}</td>

                <td>

                    <a href="/issue/{{ b[0] }}"
                    class="btn btn-primary btn-sm">
                        Issue
                    </a>

                    <a href="/return/{{ b[0] }}"
                    class="btn btn-warning btn-sm">
                        Return
                    </a>

                    <a href="/qr/{{ b[0] }}"
                    class="btn btn-info btn-sm">
                        QR
                    </a>

                    <a href="/delete/{{ b[0] }}"
                    class="btn btn-danger btn-sm">
                        Delete
                    </a>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
